<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MS1 – Whisper + pyttsx3 (FastAPI)</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:3rem auto;}
button{font-size:1rem;padding:.6rem 1rem;margin-right:.5rem;}
.log{white-space:pre-wrap;background:#f6f6f6;padding:1rem;border-radius:.5rem;}
</style>
</head>
<body>
<h1>MS1 – Whisper + pyttsx3 (FastAPI)</h1>
<p><button id="record">🎙️ Record</button><button id="stop" disabled>⏹️ Stop</button></p>
<h3>Transcription</h3><div class="log" id="log">…</div>
<h3>Reply</h3><audio id="player" controls></audio>

<script>
let recorder,chunks=[];
const rec=document.getElementById('record'),
      stopBtn=document.getElementById('stop'),
      log=document.getElementById('log'),
      player=document.getElementById('player');

async function getStream(){return await navigator.mediaDevices.getUserMedia({audio:true});}

rec.onclick=async()=>{
  chunks=[];
  const stream=await getStream();
  recorder=new MediaRecorder(stream);
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=async()=>{
    const blob=new Blob(chunks,{type:"audio/webm"});
    const fd=new FormData(); fd.append("audio",blob,"speech.webm");

    const sttRes=await fetch("/ask",{method:"POST",body:fd});
    const {text}=await sttRes.json();
    log.textContent=text||"(no speech detected)";

    // const ttsRes=await fetch("/tts",{method:"POST",
    //   headers:{"Content-Type":"application/json"},
    //   body:JSON.stringify({text:text?("You said: "+text):"I didn't catch that."})});
    // const ttsBlob=await ttsRes.blob();
    // player.src=URL.createObjectURL(ttsBlob);
    // player.play().catch(()=>{});\

    const ttsRes=await fetch("/ktts",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({text:text?("You said: "+text):"I didn't catch that."})});
  };
  recorder.start();
  rec.disabled=true; stopBtn.disabled=false;
};

stopBtn.onclick=()=>{
  if(recorder&&recorder.state==="recording")recorder.stop();
  rec.disabled=false; stopBtn.disabled=true;
};
</script>
</body>
</html>
